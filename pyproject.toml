[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ring-partner-kit"
version = "1.0.0"
description = "Production-grade developer toolkit for building Ring App Store partner integrations (Webhooks, OAuth2, Pydantic v2 schemas, and Twin Simulator)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Quiet Check-In Team", email = "dev@quietcheckin.local" }
]
keywords = ["ring", "iot", "smart-home", "webhooks", "oauth2", "elder-care", "simulator"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pydantic>=2.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
ring-partner-kit = "ring_partner_kit.cli:main"
ring-twin = "ring_partner_kit.cli:twin_main"
